<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="GIh6cFkE_wmQjEmldWGptMY-E9GwNDLaDSuUhJSsBnI"/>
<title>آلة حاسبة متعددة الاستخدامات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Cairo',sans-serif;
  transition: background 0.3s, color 0.3s, border-color 0.3s;
}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#2563eb,#0f172a 60%);
  padding:15px;
  overflow-y:auto;
  position: relative;
}
body.light-mode {
  background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 40%, #fce7f3 70%, #fef3c7 100%);
}
body::before, body::after{
  content:"";
  position:absolute;
  width:400px;
  height:400px;
  filter:blur(180px);
  opacity:.2;
  border-radius:50%;
  z-index: 1;
}
body::before{ background:#3b82f6; top:-150px; right:-150px; }
body::after{ background:#06b6d4; bottom:-150px; left:-150px; }
body.light-mode::before{ background:#a78bfa; opacity:.35; top:-150px; right:-150px; }
body.light-mode::after{ background:#f472b6; opacity:.3; bottom:-150px; left:-150px; }

.main-container {
  display: flex;
  width: 100%;
  max-width: 500px;
  align-items: flex-start;
  position: relative;
  z-index: 2;
}

.calculator{
  flex: 1;
  padding:20px;
  border-radius:30px;
  background:rgba(17,24,39,.75);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 0 30px rgba(0,0,0,.4);
  max-height:98vh;
  overflow-y:auto;
  min-width: 0;
  width: 100%;
}
body.light-mode .calculator {
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 20px 60px rgba(139, 92, 246, 0.15), 0 8px 24px rgba(59, 130, 246, 0.1);
}

/* ====== Sidebar ====== */
.sidebar-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
}
.sidebar-overlay.active {
  opacity: 1;
  visibility: visible;
}
.history-sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 420px;
  max-width: 92vw;
  background: rgba(17, 24, 39, 0.95);
  backdrop-filter: blur(20px);
  border-left: 1px solid rgba(255, 255, 255, 0.1);
  padding: 25px 20px;
  z-index: 1001;
  transform: translateX(-110%);
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  display: flex;
  flex-direction: column;
  box-shadow: 4px 0 40px rgba(0, 0, 0, 0.5);
}
body.light-mode .history-sidebar {
  background: linear-gradient(180deg, #faf5ff 0%, #f0f9ff 100%);
  border-left: 1px solid rgba(139, 92, 246, 0.15);
  box-shadow: 4px 0 40px rgba(139, 92, 246, 0.2);
}
.history-sidebar.open { transform: translateX(0); }
.history-sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
body.light-mode .history-sidebar-header { border-bottom: 2px solid rgba(139, 92, 246, 0.2); }
.history-sidebar-header h3 { color: white; margin: 0; font-size: 1.3rem; }
body.light-mode .history-sidebar-header h3 { color: #6d28d9; }
.close-sidebar-btn {
  background: none; border: none; color: #94a3b8;
  font-size: 1.8rem; cursor: pointer; padding: 0 8px;
  transition: all 0.3s;
}
body.light-mode .close-sidebar-btn { color: #a78bfa; }
.close-sidebar-btn:hover { color: #ef4444; transform: rotate(90deg); }
.history-list-sidebar {
  flex: 1; overflow-y: auto; list-style: none;
  font-size: 0.95rem; color: #cbd5e1; text-align: right; padding: 0;
}
body.light-mode .history-list-sidebar { color: #475569; }
.history-item-sidebar {
  padding: 10px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 10px;
  margin-bottom: 6px;
  background: rgba(255, 255, 255, 0.03);
  transition: all 0.2s;
  cursor: pointer;
  position: relative;
}
body.light-mode .history-item-sidebar {
  border-bottom: none;
  background: #ffffff;
  box-shadow: 0 2px 8px rgba(139, 92, 246, 0.08);
  border: 1px solid rgba(139, 92, 246, 0.1);
}
.history-item-sidebar:hover {
  background: rgba(255, 255, 255, 0.08);
  transform: translateX(-4px);
}
body.light-mode .history-item-sidebar:hover {
  background: #faf5ff;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.15);
  border-color: rgba(139, 92, 246, 0.25);
}
.history-item-sidebar .history-expr {
  font-weight: bold; color: #93c5fd;
  margin-bottom: 4px; word-break: break-all;
}
body.light-mode .history-item-sidebar .history-expr { color: #7c3aed; }
.history-item-sidebar .history-note {
  font-size: 0.8rem; color: #fbbf24; font-style: italic;
  margin-top: 4px; padding-top: 4px;
  border-top: 1px dashed rgba(255,255,255,0.1);
}
body.light-mode .history-item-sidebar .history-note {
  color: #d97706;
  border-top: 1px dashed rgba(217, 119, 6, 0.2);
}
.history-item-actions { display: flex; gap: 5px; margin-top: 6px; }
.history-item-actions button {
  flex: 1; padding: 4px 8px; border: none;
  border-radius: 6px; font-size: 0.75rem;
  cursor: pointer; height: auto; transition: all 0.2s;
}
.history-item-actions .use-btn { background: #3b82f6; color: white; }
.history-item-actions .use-btn:hover { background: #2563eb; }
.history-item-actions .note-btn { background: #f59e0b; color: white; }
.history-item-actions .note-btn:hover { background: #d97706; }
.history-item-actions .delete-btn { background: #ef4444; color: white; }
.history-item-actions .delete-btn:hover { background: #dc2626; }
.clear-history-btn {
  width: 100%; padding: 12px; border: none; border-radius: 12px;
  background: #ef4444; color: white; cursor: pointer;
  font-weight: bold; margin-top: 15px; transition: all 0.3s;
}
.clear-history-btn:hover { background: #dc2626; transform: scale(0.98); }
.history-toggle-btn {
  background: rgba(30, 41, 59, 0.8); color: white;
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 8px 16px; border-radius: 12px; cursor: pointer;
  font-size: 0.95rem; display: flex; align-items: center;
  gap: 8px; transition: all 0.3s;
}
body.light-mode .history-toggle-btn {
  background: linear-gradient(135deg, #ede9fe, #dbeafe);
  color: #6d28d9;
  border: 1px solid rgba(139, 92, 246, 0.25);
  box-shadow: 0 2px 8px rgba(139, 92, 246, 0.1);
}
.history-toggle-btn:hover {
  background: #3b82f6; color: white; transform: scale(1.02);
}
body.light-mode .history-toggle-btn:hover {
  background: linear-gradient(135deg, #a78bfa, #60a5fa);
  color: white; border-color: transparent;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
}
.badge {
  background: #3b82f6; color: white; border-radius: 50%;
  padding: 2px 8px; font-size: 0.7rem; margin-right: 5px;
}
body.light-mode .badge { background: linear-gradient(135deg, #a78bfa, #60a5fa); }

.top-bar{ display:flex; gap:10px; margin-bottom:15px; align-items: center; flex-wrap: wrap; }
select, input[type="number"], input[type="date"], input[type="text"]{
  flex:1; padding:12px; border:none; border-radius:12px;
  background:#1e293b; color:white; font-size:0.95rem; width:100%;
  min-width: 80px;
}
body.light-mode select, body.light-mode input[type="number"], body.light-mode input[type="date"], body.light-mode input[type="text"] {
  background: #ffffff; color: #4c1d95;
  border: 1.5px solid #e9d5ff;
  box-shadow: 0 2px 6px rgba(139, 92, 246, 0.08);
}
body.light-mode select:focus, body.light-mode input:focus {
  outline: none; border-color: #a78bfa;
  box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
}
.theme-btn, .fullscreen-btn, .sound-btn {
  background: #1e293b; color: white; border: none; padding: 0 15px;
  border-radius: 12px; cursor: pointer; font-size: 1.2rem;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.3s;
  height: 48px;
  min-width: 48px;
}
body.light-mode .theme-btn, body.light-mode .fullscreen-btn, body.light-mode .sound-btn {
  background: linear-gradient(135deg, #fef3c7, #fce7f3);
  color: #d97706;
  border: 1px solid rgba(251, 191, 36, 0.3);
  box-shadow: 0 2px 8px rgba(251, 191, 36, 0.15);
}
body.light-mode .theme-btn:hover, body.light-mode .fullscreen-btn:hover, body.light-mode .sound-btn:hover {
  background: linear-gradient(135deg, #fde68a, #fbcfe8);
  box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
}
.sound-btn.muted {
  background: #ef4444;
  color: white !important;
}
body.light-mode .sound-btn.muted {
  background: linear-gradient(135deg, #f87171, #ef4444) !important;
  color: white !important;
  border-color: transparent !important;
  box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3) !important;
}
.spin { display: inline-block; animation: spin 0.5s ease-in-out; }
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

h2, h3{ color:white; text-align:center; margin-bottom:15px; }
body.light-mode h2 {
  color: #6d28d9;
  background: linear-gradient(135deg, #7c3aed, #2563eb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
body.light-mode h3 { color: #7c3aed; }

.screen{
  width:100%; height:80px; border:none; border-radius:18px;
  background:#0f172a; color:white; font-size:2rem; padding:10px;
  margin-bottom:15px; text-align:left;
}
body.light-mode .screen {
  background: linear-gradient(135deg, #faf5ff, #eff6ff);
  color: #4c1d95;
  border: 2px solid #e9d5ff;
  box-shadow: inset 0 2px 8px rgba(139, 92, 246, 0.08);
}

.action-row { display: flex; gap: 10px; margin-bottom: 12px; }
.copy-result-btn, .tools-toggle-btn {
  flex: 1; padding: 12px; border: none; border-radius: 12px;
  cursor: pointer; font-weight: bold; font-size: 0.95rem;
  transition: all 0.3s; color: white;
}
.copy-result-btn { background: #06b6d4; }
body.light-mode .copy-result-btn {
  background: linear-gradient(135deg, #22d3ee, #06b6d4);
  box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25);
}
.copy-result-btn:hover { background: #0891b2; transform: scale(1.02); }
.copy-result-btn.copied { background: #22c55e; }
body.light-mode .copy-result-btn.copied {
  background: linear-gradient(135deg, #4ade80, #22c55e);
  box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
}
.tools-toggle-btn { background: #7c3aed; }
body.light-mode .tools-toggle-btn {
  background: linear-gradient(135deg, #a78bfa, #8b5cf6);
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
}
.tools-toggle-btn:hover { background: #6d28d9; transform: scale(1.02); }
.tools-toggle-btn.active { background: #a855f7; }

.buttons{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
button{
  height:55px; border:none; border-radius:14px; font-size:1.2rem;
  color:white; background:#1e293b; cursor: pointer; position: relative;
}
body.light-mode button { background: #e2e8f0; color: #1e293b; }
button:active{ transform:scale(.96); }
.operator{ background:#f97316; color:white !important; }
.equal{ background:#10b981; grid-column:span 2; color: white !important; }
.clear{ background:#ef4444; color: white !important; }
.zero{ grid-column:span 2; }
.sci-btn{ background:#8b5cf6; color:white !important; font-size:0.9rem; }
.sci-close{ background:#a78bfa; color:white !important; font-size:0.9rem; }

body.light-mode .buttons button:not(.operator):not(.equal):not(.clear):not(.sci-btn):not(.sci-close) {
  background: linear-gradient(135deg, #ffffff, #f8fafc);
  color: #4c1d95;
  border: 1.5px solid #e9d5ff;
  box-shadow: 0 2px 6px rgba(139, 92, 246, 0.08);
  font-weight: 600;
}
body.light-mode .buttons button:not(.operator):not(.equal):not(.clear):not(.sci-btn):not(.sci-close):hover {
  background: linear-gradient(135deg, #faf5ff, #ede9fe);
  border-color: #c4b5fd;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
  transform: translateY(-2px);
}
body.light-mode .operator {
  background: linear-gradient(135deg, #fb923c, #f97316);
  color: white !important;
  box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
}
body.light-mode .operator:hover {
  background: linear-gradient(135deg, #f97316, #ea580c);
  box-shadow: 0 6px 16px rgba(249, 115, 22, 0.35);
  transform: translateY(-2px);
}
body.light-mode .equal {
  background: linear-gradient(135deg, #34d399, #10b981);
  color: white !important;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
}
body.light-mode .equal:hover {
  background: linear-gradient(135deg, #10b981, #059669);
  box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
  transform: translateY(-2px);
}
body.light-mode .clear {
  background: linear-gradient(135deg, #f87171, #ef4444);
  color: white !important;
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
}
body.light-mode .clear:hover {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
  transform: translateY(-2px);
}
body.light-mode .sci-btn {
  background: linear-gradient(135deg, #a78bfa, #8b5cf6);
  color: white !important;
  box-shadow: 0 3px 10px rgba(139, 92, 246, 0.25);
}
body.light-mode .sci-btn:hover {
  background: linear-gradient(135deg, #8b5cf6, #7c3aed);
  box-shadow: 0 5px 14px rgba(139, 92, 246, 0.35);
  transform: translateY(-2px);
}
body.light-mode .sci-close {
  background: linear-gradient(135deg, #c4b5fd, #a78bfa);
  color: white !important;
  box-shadow: 0 3px 10px rgba(167, 139, 250, 0.25);
}

.box-section{ margin-top:20px; padding:15px; border-radius:18px; background:#0f172a; }
body.light-mode .box-section {
  background: linear-gradient(135deg, #ffffff, #faf5ff);
  border: 1px solid rgba(139, 92, 246, 0.15);
  box-shadow: 0 4px 16px rgba(139, 92, 246, 0.08);
}

.result{ text-align:center; margin-top:10px; color:#22c55e; font-weight:bold; font-size:1.1rem; min-height: 25px;}
.btn-action { width:100%; background:#10b981; padding:12px; border-radius:12px; color:white; border:none; cursor:pointer; font-weight:bold; margin-top:10px;}
body.light-mode .btn-action {
  background: linear-gradient(135deg, #34d399, #10b981);
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
}
body.light-mode .btn-action:hover {
  background: linear-gradient(135deg, #10b981, #059669);
  box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
  transform: translateY(-2px);
}
.tabs { display: flex; gap: 5px; margin-bottom: 15px; background: #0f172a; padding: 5px; border-radius: 12px; flex-wrap: wrap; overflow-x: auto; }
body.light-mode .tabs {
  background: linear-gradient(135deg, #faf5ff, #eff6ff);
  border: 1px solid rgba(139, 92, 246, 0.15);
}
.tab-btn { flex: 1; min-width: 50px; padding: 6px 8px; font-size: 0.7rem; border-radius: 8px; background: transparent; color: #cbd5e1; border: none; cursor: pointer; white-space: nowrap; }
body.light-mode .tab-btn { color: #7c3aed; }
body.light-mode .tab-btn:hover { background: rgba(167, 139, 250, 0.15); }
.tab-btn.active { background: #3b82f6; color: white; }
body.light-mode .tab-btn.active {
  background: linear-gradient(135deg, #a78bfa, #8b5cf6);
  color: white;
  box-shadow: 0 3px 10px rgba(139, 92, 246, 0.3);
}

.bmi-graph {
  width: 100%; height: 30px;
  background: linear-gradient(to right, #3b82f6, #22c55e, #facc15, #ef4444);
  border-radius: 15px; margin-top: 10px;
  position: relative; overflow: hidden;
}
.bmi-indicator {
  position: absolute; top: -8px; width: 6px; height: 46px;
  background: white; border-radius: 3px;
  box-shadow: 0 0 15px rgba(255,255,255,0.8);
  transition: left 0.5s ease;
}
.bmi-labels {
  display: flex; justify-content: space-between;
  font-size: 0.6rem; color: #94a3b8; margin-top: 5px;
}
body.light-mode .bmi-labels { color: #7c3aed; }

.timer-display {
  font-size: 2.5rem; text-align: center;
  color: #22c55e; font-weight: bold;
  padding: 10px; font-family: monospace;
}
body.light-mode .timer-display {
  color: #059669;
  text-shadow: 0 2px 4px rgba(16, 185, 129, 0.1);
}
.timer-buttons { display: flex; gap: 10px; margin-top: 10px; }
.timer-buttons button { flex: 1; height: 45px; font-size: 1rem; }

.percent-inputs { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.percent-inputs input { flex: 1; min-width: 80px; }

.note-modal {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  display: none; justify-content: center; align-items: center;
  z-index: 2000; padding: 20px;
}
.note-modal.active { display: flex; }
.note-modal-content {
  background: #1e293b; padding: 25px; border-radius: 20px;
  width: 100%; max-width: 400px;
  border: 1px solid rgba(255,255,255,0.1);
}
body.light-mode .note-modal-content {
  background: linear-gradient(135deg, #ffffff, #faf5ff);
  border: 2px solid #e9d5ff;
  box-shadow: 0 20px 60px rgba(139, 92, 246, 0.3);
}
.note-modal-content h3 { margin-bottom: 15px; }
.note-modal-content textarea {
  width: 100%; padding: 12px; border-radius: 12px;
  border: none; background: #0f172a; color: white;
  font-family: 'Cairo', sans-serif; font-size: 0.95rem;
  resize: vertical; min-height: 80px; margin-bottom: 12px;
}
body.light-mode .note-modal-content textarea {
  background: #ffffff; color: #4c1d95;
  border: 1.5px solid #e9d5ff;
}
body.light-mode .note-modal-content textarea:focus {
  outline: none; border-color: #a78bfa;
  box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
}
.note-modal-buttons { display: flex; gap: 10px; }
.note-modal-buttons button { flex: 1; height: 45px; font-size: 1rem; border-radius: 12px; }

.sound-toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(30, 41, 59, 0.95);
  color: white;
  padding: 12px 24px;
  border-radius: 12px;
  font-weight: bold;
  z-index: 9999;
  opacity: 0;
  transition: all 0.4s ease;
  pointer-events: none;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
}
.sound-toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
body.light-mode .sound-toast {
  background: linear-gradient(135deg, #7c3aed, #2563eb);
  box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
  border: none;
}

@media (max-width: 768px) {
  .history-sidebar { width: 100%; max-width: 100%; }
  .buttons { grid-template-columns: repeat(4,1fr); gap: 6px; }
  button { height: 48px; font-size: 1rem; }
  .sci-btn { font-size: 0.75rem; }
  .sci-close { font-size: 0.75rem; }
  .theme-btn, .fullscreen-btn, .sound-btn { height: 44px; min-width: 44px; padding: 0 12px; }
}
</style>
</head>
<body>

<div class="main-container">
  <div class="calculator" id="calculator">
    <h2 id="title">آلة حاسبة متعددة الاستخدامات</h2>

    <div class="top-bar">
      <select id="language" onchange="changeLanguage()">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="el">Ελληνικά</option>
        <option value="tr">Türkçe</option>
        <option value="ku">Kurdî</option>
      </select>
      <button class="history-toggle-btn" onclick="toggleSidebar()">
        📋 <span id="historyToggleText">السجل</span>
        <span class="badge" id="historyBadge">0</span>
      </button>
      <button class="sound-btn" id="soundToggle" onclick="toggleSound()" title="الصوت"><span id="soundIcon">🔊</span></button>
      <button class="fullscreen-btn" onclick="toggleFullscreen()" title="شاشة كاملة">⛶</button>
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()"><span id="themeIcon">🌙</span></button>
    </div>

let audioCtx = null;
let soundEnabled = true;

(function loadSoundPref() {
  const saved = localStorage.getItem("soundEnabled");
  if (saved === "false") soundEnabled = false;
})();

function initAudio() {
  if (!soundEnabled) return null;
  if (!audioCtx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    } catch(e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep(freq, duration, type, volume) {
  if (!soundEnabled) return;
  const ctx = initAudio();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    switch(type) {
      case 'operator': beep(900, 0.08, 'sine', 0.1); break;
      case 'equal':
        beep(660, 0.06, 'sine', 0.1);
        setTimeout(() => beep(880, 0.06, 'sine', 0.1), 55);
        setTimeout(() => beep(1100, 0.1, 'sine', 0.1), 110);
        break;
      case 'clear': beep(320, 0.12, 'sawtooth', 0.09); break;
      case 'error': beep(180, 0.2, 'sawtooth', 0.1); break;
      default: beep(1400, 0.04, 'square', 0.07); break;
    }
  } catch(e) {}
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const icon = document.getElementById("soundIcon");
  const btn = document.getElementById("soundToggle");
  if (soundEnabled) {
    icon.innerText = "🔊";
    btn.classList.remove("muted");
    localStorage.setItem("soundEnabled", "true");
    showSoundToast(getToastText('on'));
    setTimeout(() => beep(900, 0.08, 'sine', 0.1), 100);
    setTimeout(() => beep(1200, 0.1, 'sine', 0.1), 180);
  } else {
    beep(600, 0.06, 'sine', 0.1);
    setTimeout(() => beep(400, 0.1, 'sine', 0.1), 70);
    icon.innerText = "🔇";
    btn.classList.add("muted");
    localStorage.setItem("soundEnabled", "false");
    setTimeout(() => showSoundToast(getToastText('off')), 150);
  }
}

function getToastText(state) {
  const toasts = {
    ar: { on: "🔊 تم تشغيل الصوت", off: "🔇 تم كتم الصوت" },
    en: { on: "🔊 Sound On", off: "🔇 Sound Off" },
    es: { on: "🔊 Sonido Activado", off: "🔇 Sonido Desactivado" },
    fr: { on: "🔊 Son Activé", off: "🔇 Son Désactivé" },
    el: { on: "🔊 Ήχος Ενεργός", off: "🔇 Ήχος Ανενεργός" },
    tr: { on: "🔊 Ses Açık", off: "🔇 Ses Kapalı" },
    ku: { on: "🔊 دەنگ چالاکە", off: "🔇 دەنگ ناچالاکە" }
  };
  return toasts[lang] ? toasts[lang][state] : toasts.en[state];
}

let soundToastTimeout = null;
function showSoundToast(message) {
  const toast = document.getElementById("soundToast");
  toast.innerText = message;
  toast.classList.add("show");
  clearTimeout(soundToastTimeout);
  soundToastTimeout = setTimeout(() => toast.classList.remove("show"), 1800);
}

document.addEventListener('click', function() { if (soundEnabled) initAudio(); }, { once: true });
document.addEventListener('touchstart', function() { if (soundEnabled) initAudio(); }, { once: true });
document.addEventListener('keydown', function() { if (soundEnabled) initAudio(); }, { once: true });

document.addEventListener('click', function(e) {
  if (!soundEnabled) return;
  const btn = e.target.closest('button');
  if (btn) {
    if (btn.id === 'soundToggle') return;
    const oc = btn.getAttribute('onclick') || '';
    if (oc.includes('appendValue(') || oc.includes('calculate()')) return;
    if (oc.includes('playSound(')) return;
    playSound('click');
  }
}, true);

function getNumeralSystem() { return numeralSystems[lang] || numeralSystems.en; }

function toLocalNumbers(str) {
  if (typeof str !== 'string') str = String(str);
  const sys = getNumeralSystem();
  let result = str;
  result = result.replace(/[0-9]/g, d => sys.digits[parseInt(d)]);
  if (sys.decimal !== '.') result = result.replace(/\./g, sys.decimal);
  return result;
}

function toEnglishNumbers(str) {
  if (typeof str !== 'string') str = String(str);
  let result = str;
  result = result.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  result = result.replace(/٫/g, '.');
  result = result.replace(/،/g, ',');
  return result;
}

// ============================================================
// ====== appendValue (يعمل عادة) ======
// ============================================================
function appendValue(v) {
  let screen = document.getElementById("screen");
  
  // إذا كانت الشاشة تعرض رسالة المشكلة، امسحها عند إدخال رقم
  if (screen.value.includes("⚠️")) {
    if (/[0-9٠-٩]/.test(v)) {
      currentExpression = "";
      screen.value = "";
    } else {
      return;
    }
  }
  
  if (v === 'C') { 
    playSound('clear');
    currentExpression = ""; 
    screen.value = ""; 
    return; 
  }
  
  if (['+','-','*','/','%','.'].includes(v)) {
    playSound('operator');
  } else {
    playSound('click');
  }
  
  currentExpression += v;
  screen.value = toLocalNumbers(currentExpression);
}

// ============================================================
// ====== calculate: الآن يعرض رسالة المشكلة بدلاً من الحساب ======
// ============================================================
function calculate() {
  try {
    let screen = document.getElementById("screen");
    
    // إذا لم يكن هناك تعبير، لا تفعل شيئاً
    if (!currentExpression || currentExpression.trim() === "") {
      return;
    }
    
    // عرض رسالة المشكلة حسب اللغة الحالية
    const message = problemMessages[lang] || problemMessages.ar;
    
    // عرض الرسالة على الشاشة
    screen.value = message;
    screen.style.fontSize = "1.2rem";
    screen.style.color = "#fbbf24";
    
    // تشغيل صوت الخطأ
    playSound('error');
    
    // إضافة الرسالة إلى السجل
    addHistoryItem(`⚠️ ${currentExpression} = ${message}`);
    
    // مسح التعبير الداخلي
    currentExpression = "";
  } catch(e) {
    console.error("Error:", e);
  }
}

// ============================================================
// ====== لوحة المفاتيح ======
// ============================================================
document.addEventListener('keydown', function(event) {
  const key = event.key;
  const activeEl = document.activeElement;
  if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT')) {
    if (activeEl.id !== 'screen') {
      if (key === 'Enter') { event.preventDefault(); handleEnterInPanel(activeEl); }
      return;
    }
  }
  if ((key >= '0' && key <= '9') || key === '.') { appendValue(key); }
  else if (key === '+') { appendValue('+'); }
  else if (key === '-') { appendValue('-'); }
  else if (key === '*') { appendValue('*'); }
  else if (key === '/') { event.preventDefault(); appendValue('/'); }
  else if (key === '%') { appendValue('%'); }
  else if (key === '(') { appendValue('('); }
  else if (key === ')') { appendValue(')'); }
  else if (key === 'Enter' || key === '=') { event.preventDefault(); calculate(); }
  else if (key === 'Escape') { appendValue('C'); }
  else if (key === 'Backspace') {
    currentExpression = currentExpression.slice(0, -1);
    document.getElementById("screen").value = toLocalNumbers(currentExpression);
  }
});

function handleEnterInPanel(el) {
  const id = el.id;
  if (id === 'amount' || id === 'fromCurrency' || id === 'toCurrency') convertCurrency();
  else if (id === 'weight' || id === 'height' || id === 'healthAge') calculateHealth();
  else if (id === 'tempInput' || id === 'fromTemp' || id === 'toTemp') convertTemperature();
  else if (id === 'birthDate') calculateAge();
  else if (id === 'percentValue' || id === 'percentTotal') calculatePercent();
  else if (id === 'percentFrom' || id === 'percentChange') calculatePercentChange();
}

function switchTab(tab, event) {
  document.getElementById("currencyPanel").style.display = tab === 'currency' ? 'block' : 'none';
  document.getElementById("healthPanel").style.display = tab === 'health' ? 'block' : 'none';
  document.getElementById("tempPanel").style.display = tab === 'temp' ? 'block' : 'none';
  document.getElementById("agePanel").style.display = tab === 'age' ? 'block' : 'none';
  document.getElementById("percentPanel").style.display = tab === 'percent' ? 'block' : 'none';
  document.getElementById("timerPanel").style.display = tab === 'timer' ? 'block' : 'none';
  let tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach(t => t.classList.remove('active'));
  if (event && event.currentTarget) event.currentTarget.classList.add('active');
}

function convertCurrency() {

  const message = problemMessages[lang] || problemMessages.ar;

  resultDiv.innerText = message;

// ====== الصحة ======
function calculateHealth() {
  let w = parseFloat(document.getElementById("weight").value);
  let h = parseFloat(document.getElementById("height").value) / 100;
  let age = parseFloat(document.getElementById("healthAge").value);
  let resDiv = document.getElementById("healthResult");
  let ageResDiv = document.getElementById("healthAgeResult");
  let idealDiv = document.getElementById("healthIdeal");
  let graphContainer = document.getElementById("bmiGraphContainer");
  const t = text[lang];
  if (!w || !h || h <= 0 || w <= 0) {
    resDiv.style.color = "#ef4444";
    resDiv.innerText = lang === "ar" ? "⚠️ أدخل قيم صحيحة" : "⚠️ Enter valid values";
    return;
  }
  let bmi = (w / (h * h));
  let status = "", color = "", position = 0;
  if (bmi < 18.5) { status = t.underweight; color = "#3b82f6"; position = 10; }
  else if (bmi < 25) { status = t.normal; color = "#22c55e"; position = 35; }
  else if (bmi < 30) { status = t.overweight; color = "#facc15"; position = 60; }
  else { status = t.obese; color = "#ef4444"; position = 85; }
  resDiv.innerText = `BMI = ${bmi.toFixed(1)} (${status})`;
  resDiv.style.color = color;
  graphContainer.style.display = 'block';
  let indicator = document.getElementById('bmiIndicator');
  indicator.style.left = Math.min(Math.max(position, 2), 98) + '%';
  indicator.style.background = color;
  let idealMin = 18.5 * h * h;
  let idealMax = 24.9 * h * h;
  idealDiv.innerText = `${t.idealWeight}: ${idealMin.toFixed(1)} - ${idealMax.toFixed(1)} kg`;
  if (age && !isNaN(age)) {
    let ageCat = "";
    if (age < 13) ageCat = t.child;
    else if (age < 20) ageCat = t.teen;
    else if (age < 60) ageCat = t.adult;
    else ageCat = t.senior;
    ageResDiv.innerText = `${t.ageCategory}: ${ageCat} (${age} ${lang === "ar" || lang === "ku" ? "سنة" : lang === "tr" ? "yıl" : "years"})`;
  } else {
    ageResDiv.innerText = "";
  }
  addHistoryItem(`⚖️ BMI = ${bmi.toFixed(1)} (${status})${age ? ` - ${t.ageCategory}: ${age}` : ""}`);
}

function convertTemperature() {
  let val = parseFloat(document.getElementById("tempInput").value);
  let from = document.getElementById("fromTemp").value;
  let to = document.getElementById("toTemp").value;
  let resDiv = document.getElementById("tempResult");
  if (isNaN(val)) return;
  let c;
  if (from === "C") c = val;
  else if (from === "F") c = (val - 32) * 5 / 9;
  else if (from === "K") c = val - 273.15;
  let finalOutput;
  if (to === "C") finalOutput = c.toFixed(2) + " °C";
  else if (to === "F") finalOutput = (c * 9 / 5 + 32).toFixed(2) + " °F";
  else if (to === "K") finalOutput = (c + 273.15).toFixed(2) + " K";
  resDiv.innerText = finalOutput;
  addHistoryItem(`🌡️ ${val}°${from} → ${finalOutput}`);
}

function calculateAge() {
  let birthInput = document.getElementById("birthDate").value;
  let resDiv = document.getElementById("ageResult");
  if (!birthInput) return;
  let birth = new Date(birthInput);
  let now = new Date();
  let years = now.getFullYear() - birth.getFullYear();
  let months = now.getMonth() - birth.getMonth();
  let days = now.getDate() - birth.getDate();
  if (days < 0) { months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (months < 0) { years--; months += 12; }
  let msg = lang === "ar" ? `العمر: ${years} سنة، ${months} شهر، ${days} يوم` :
            lang === "es" ? `Edad: ${years} años, ${months} meses, ${days} días` :
            lang === "fr" ? `Âge: ${years} ans, ${months} mois, ${days} jours` :
            lang === "el" ? `Ηλικία: ${years} χρόνια, ${months} μήνες, ${days} ημέρες` :
            lang === "tr" ? `Yaş: ${years} yıl, ${months} ay, ${days} gün` :
            lang === "ku" ? `تەمەن: ${years} ساڵ، ${months} مانگ، ${days} ڕۆژ` :
            `Age: ${years} years, ${months} months, ${days} days`;
  resDiv.innerText = msg;
  addHistoryItem(`📅 ${msg}`);
}

function calculatePercent() {
  let val = parseFloat(document.getElementById("percentValue").value);
  let total = parseFloat(document.getElementById("percentTotal").value);
  let resDiv = document.getElementById("percentResult");
  if (isNaN(val) || isNaN(total) || total === 0) return;
  let percent = (val / total * 100).toFixed(2);
  resDiv.innerText = `${val} هي ${percent}% من ${total}`;
  addHistoryItem(`% ${val} من ${total} = ${percent}%`);
}

function calculatePercentChange() {
  let from = parseFloat(document.getElementById("percentFrom").value);
  let change = parseFloat(document.getElementById("percentChange").value);
  let resDiv = document.getElementById("percentChangeResult");
  if (isNaN(from) || isNaN(change)) return;
  let result = from + (from * change / 100);
  resDiv.innerText = `${from} + ${change}% = ${result.toFixed(2)}`;
  addHistoryItem(`% ${from} + ${change}% = ${result.toFixed(2)}`);
}

function formatTime(sec) {
  let h = Math.floor(sec / 3600);
  let m = Math.floor((sec % 3600) / 60);
  let s = Math.floor(sec % 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateTimerDisplay() {
  document.getElementById("timerDisplay").innerText = formatTime(timerSeconds);
}

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  timerInterval = setInterval(() => { timerSeconds++; updateTimerDisplay(); }, 1000);
}

function pauseTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
}

function resetTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  timerSeconds = 0;
  updateTimerDisplay();
}

function toggleFullscreen() {

    document.documentElement.requestFullscreen().catch(() => {});

function copyResult() {
  const screen = document.getElementById("screen");
  let textToCopy = toEnglishNumbers(screen.value);
  if (!textToCopy || textToCopy.includes("⚠️")) return;
  navigator.clipboard.writeText(textToCopy).then(() => {
    const btn = document.getElementById("copyResultBtn");
    const t = text[lang];
    btn.innerText = t.copied;
    btn.classList.add("copied");
    setTimeout(() => {
      btn.innerText = t.copyResult;
      btn.classList.remove("copied");
    }, 1500);
  }).catch(() => {
    screen.select();
    document.execCommand('copy');
  });
}

function toggleSidebar() {
  document.getElementById("historySidebar").classList.toggle("open");
  document.getElementById("sidebarOverlay").classList.toggle("active");
}

function addHistoryItem(text, expr) {
  const list = document.getElementById("historyListSidebar");
  const li = document.createElement("li");
  li.className = "history-item-sidebar";
  const exprDiv = document.createElement("div");
  exprDiv.className = "history-expr";
  exprDiv.innerText = text;
  li.appendChild(exprDiv);
  const noteDiv = document.createElement("div");
  noteDiv.className = "history-note";
  noteDiv.style.display = "none";
  li.appendChild(noteDiv);
  const actions = document.createElement("div");
  actions.className = "history-item-actions";
  const t = text[lang];
  if (expr) {
    const useBtn = document.createElement("button");
    useBtn.className = "use-btn";
    useBtn.innerText = t.useBtn;
    useBtn.onclick = (e) => { e.stopPropagation(); useHistoryItem(expr); };
    actions.appendChild(useBtn);
  }
  const noteBtn = document.createElement("button");
  noteBtn.className = "note-btn";
  noteBtn.innerText = t.noteBtn;
  noteBtn.onclick = (e) => { e.stopPropagation(); openNoteModal(li); };
  actions.appendChild(noteBtn);
  const delBtn = document.createElement("button");
  delBtn.className = "delete-btn";
  delBtn.innerText = "🗑️";
  delBtn.onclick = (e) => { e.stopPropagation(); li.remove(); updateBadge(); saveHistoryToStorage(); };
  actions.appendChild(delBtn);
  li.appendChild(actions);
  list.insertBefore(li, list.firstChild);
  updateBadge();
  saveHistoryToStorage();
}

function useHistoryItem(expr) {
  let current = toEnglishNumbers(expr);
  if (current.includes("=")) {
    const idx = current.lastIndexOf("=");
    current = current.substring(0, idx).trim();
  }
  currentExpression = current;
  document.getElementById("screen").value = toLocalNumbers(current);
  document.getElementById("screen").style.fontSize = "2rem";
  document.getElementById("screen").style.color = "";
  if (document.getElementById("historySidebar").classList.contains("open")) toggleSidebar();
}

function openNoteModal(li) {
  editingHistoryLi = li;
  const noteDiv = li.querySelector(".history-note");
  const existingNote = noteDiv && noteDiv.style.display !== "none" ? noteDiv.innerText.replace("📝 ", "") : "";
  document.getElementById("noteInput").value = existingNote;
  document.getElementById("noteModal").classList.add("active");
  document.getElementById("noteInput").focus();
}

function closeNoteModal() {
  document.getElementById("noteModal").classList.remove("active");
  editingHistoryLi = null;
}

function saveNote() {
  if (!editingHistoryLi) return;
  const noteDiv = editingHistoryLi.querySelector(".history-note");
  if (!noteDiv) return;
  const note = document.getElementById("noteInput").value.trim();
  if (note) {
    noteDiv.innerText = "📝 " + note;
    noteDiv.style.display = "block";
  } else {
    noteDiv.innerText = "";
    noteDiv.style.display = "none";
  }
  saveHistoryToStorage();
  closeNoteModal();
}

function clearHistory() {
  document.getElementById("historyListSidebar").innerHTML = "";
  localStorage.removeItem("calcHistory");
  updateBadge();
}

function updateBadge() {
  const count = document.querySelectorAll("#historyListSidebar .history-item-sidebar").length;
  document.getElementById("historyBadge").innerText = count;
}

function saveHistoryToStorage() {
  const items = [];
  document.querySelectorAll("#historyListSidebar .history-item-sidebar").forEach(li => {
    const expr = li.querySelector(".history-expr")?.innerText || "";
    const noteEl = li.querySelector(".history-note");
    const note = noteEl && noteEl.style.display !== "none" ? noteEl.innerText : "";
    items.push({ expr, note });
  });
  localStorage.setItem("calcHistory", JSON.stringify(items));
}

function loadHistoryFromStorage() {
  const saved = localStorage.getItem("calcHistory");
  if (saved) {
    try {
      const items = JSON.parse(saved);
      const list = document.getElementById("historyListSidebar");
      items.forEach(item => {
        const li = document.createElement("li");
        li.className = "history-item-sidebar";
        const exprDiv = document.createElement("div");
        exprDiv.className = "history-expr";
        exprDiv.innerText = item.expr || "";
        li.appendChild(exprDiv);
        const noteDiv = document.createElement("div");
        noteDiv.className = "history-note";
        if (item.note) {
          noteDiv.innerText = item.note;
          noteDiv.style.display = "block";
        } else {
          noteDiv.style.display = "none";
        }
        li.appendChild(noteDiv);
        const actions = document.createElement("div");
        actions.className = "history-item-actions";
        const t = text[lang];
        let expr = item.expr || "";
        if (expr.includes("=")) expr = expr.split("=")[0].trim();
        if (expr && !expr.includes("⚠️") && !expr.includes("💱")) {
          const useBtn = document.createElement("button");
          useBtn.className = "use-btn";
          useBtn.innerText = t.useBtn;
          useBtn.onclick = (e) => { e.stopPropagation(); useHistoryItem(expr); };
          actions.appendChild(useBtn);
        }
        const noteBtn = document.createElement("button");
        noteBtn.className = "note-btn";
        noteBtn.innerText = t.noteBtn;
        noteBtn.onclick = (e) => { e.stopPropagation(); openNoteModal(li); };
        actions.appendChild(noteBtn);
        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.innerText = "🗑️";
        delBtn.onclick = (e) => { e.stopPropagation(); li.remove(); updateBadge(); saveHistoryToStorage(); };
        actions.appendChild(delBtn);
        li.appendChild(actions);
        list.appendChild(li);
      });
      updateBadge();
    } catch(e) { console.error("Error loading history:", e); }
  }
}

  document.getElementById("btnPercentChange").innerText = t.btnPercentChange;

  document.getElementById("copyResultBtn").innerText = t.copyResult;
  document.getElementById("toolsToggleBtn").innerText = sciVisible ? t.toolsToggleClose : t.toolsToggle;
  document.getElementById("noteModalTitle").innerText = t.noteTitle;

  document.getElementById("timerReset").innerText = t.timerReset;
  document.getElementById("bmiLabel1").innerText = t.bmiLabel1;
  document.getElementById("bmiLabel2").innerText = t.bmiLabel2;
  document.getElementById("bmiLabel3").innerText = t.bmiLabel3;
  document.getElementById("bmiLabel4").innerText = t.bmiLabel4;
  if (lang === "ar" || lang === "ku") document.documentElement.dir = "rtl";
  else document.documentElement.dir = "ltr";
  updateButtonNumbers();
  
  // تحديث الشاشة إذا كانت تعرض رسالة مشكلة
  const screen = document.getElementById("screen");
  if (screen.value && screen.value.includes("⚠️")) {
    screen.value = problemMessages[lang] || problemMessages.ar;
  } else if (currentExpression) {
    screen.value = toLocalNumbers(currentExpression);
  }
  
  updateHistoryNumbers();
  const currencyResult = document.getElementById("currencyResult");
  if (currencyResult && currencyResult.innerText.trim() !== "") {
    currencyResult.innerText = problemMessages[lang] || problemMessages.ar;
  }
}

function updateButtonNumbers() {
  document.querySelectorAll('button[data-num]').forEach(btn => {
    const num = btn.getAttribute('data-num');
    btn.innerText = toLocalNumbers(num);
  });
}

function updateHistoryNumbers() {
  document.querySelectorAll("#historyListSidebar .history-expr").forEach(el => {
    const engText = toEnglishNumbers(el.innerText);
    el.innerText = toLocalNumbers(engText);
  });
}

function toggleTheme() {
  const body = document.body;
  const icon = document.getElementById("themeIcon");
  icon.classList.add("spin");
  setTimeout(() => icon.classList.remove("spin"), 500);
  body.classList.toggle("light-mode");
  if (body.classList.contains("light-mode")) {
    icon.innerText = "☀️";
    localStorage.setItem("theme", "light");
  } else {
    icon.innerText = "🌙";
    localStorage.setItem("theme", "dark");
  }
}

window.onload = function() {
  loadHistoryFromStorage();
  const savedTheme = localStorage.getItem("theme");
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  if (savedTheme === "light" || (!savedTheme && prefersLight)) {
    document.body.classList.add("light-mode");
    document.getElementById("themeIcon").innerText = "☀️";
  }
  if (!soundEnabled) {
    document.getElementById("soundIcon").innerText = "🔇";
    document.getElementById("soundToggle").classList.add("muted");
  }
  updateTimerDisplay();
  updateButtonNumbers();
  currentExpression = "";

  const inputIds = ['amount', 'weight', 'height', 'healthAge', 'tempInput', 'percentValue', 'percentTotal', 'percentFrom', 'percentChange'];
  inputIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); handleEnterInPanel(this); }
      });
    }
  });
  const selectIds = ['fromCurrency', 'toCurrency', 'fromTemp', 'toTemp'];
  selectIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); handleEnterInPanel(this); }
      });
    }
  });
  const birthEl = document.getElementById('birthDate');
  if (birthEl) {
    birthEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); calculateAge(); }
    });
  }
};
</script>
